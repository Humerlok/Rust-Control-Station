[workspace]
members = [
  "crates/mavlink",
  "crates/transport",
  "crates/vehicle-state",
  "crates/commands",
  "crates/map-cache",
  "crates/dataflash",
  "crates/ardupilot-meta",
  "crates/link",
  "desktop/src-tauri",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["Rust Control Station contributors"]

[workspace.dependencies]
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43", features = ["macros", "rt-multi-thread", "sync", "net", "time", "io-util"] }
