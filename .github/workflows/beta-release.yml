name: Beta release

# Dispara ao enviar uma tag como beta-0.1.0 (ou manualmente pela aba Actions).
on:
  push:
    tags: ["beta-*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm, ubuntu-22.04, ubuntu-22.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias do Linux (Tauri + rpm)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm libssl-dev libudev-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: rust/desktop/ui/package-lock.json

      - name: Instalar dependencias da UI
        run: npm ci
        working-directory: rust/desktop/ui

      - name: Gerar instaladores
        run: npx --prefix ../ui tauri build
        working-directory: rust/desktop/src-tauri

      - name: Guardar instaladores
        uses: actions/upload-artifact@v4
        with:
          name: instaladores-${{ matrix.os }}
          if-no-files-found: error
          path: |
            rust/target/release/bundle/nsis/*.exe
            rust/target/release/bundle/msi/*.msi
            rust/target/release/bundle/deb/*.deb
            rust/target/release/bundle/rpm/*.rpm
            rust/target/release/bundle/appimage/*.AppImage

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/beta-')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          files: dist/*
